<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌹 Sundos 🌹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 500px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الوردة */
        .rose-container {
            position: relative;
            width: 300px;
            height: 400px;
            animation: roseFloat 4s ease-in-out infinite;
        }

        /* البتلات الخارجية - الأحمر الداكن */
        .petal-outer {
            position: absolute;
            width: 70px;
            height: 90px;
            background: linear-gradient(135deg, #8B0000, #DC143C, #FF1493);
            border-radius: 50% 50% 50% 0;
            left: 115px;
            top: 10px;
            filter: drop-shadow(0 8px 15px rgba(139, 0, 0, 0.6));
            animation: petalSway 3s ease-in-out infinite;
        }

        .petal-outer:nth-child(1) { transform: rotate(0deg); animation-delay: 0s; }
        .petal-outer:nth-child(2) { transform: rotate(45deg); animation-delay: 0.2s; }
        .petal-outer:nth-child(3) { transform: rotate(90deg); animation-delay: 0.4s; }
        .petal-outer:nth-child(4) { transform: rotate(135deg); animation-delay: 0.6s; }
        .petal-outer:nth-child(5) { transform: rotate(180deg); animation-delay: 0.8s; }
        .petal-outer:nth-child(6) { transform: rotate(225deg); animation-delay: 1s; }
        .petal-outer:nth-child(7) { transform: rotate(270deg); animation-delay: 1.2s; }
        .petal-outer:nth-child(8) { transform: rotate(315deg); animation-delay: 1.4s; }

        /* البتلات الوسطانية - الوردي */
        .petal-middle {
            position: absolute;
            width: 55px;
            height: 75px;
            background: linear-gradient(135deg, #FF1493, #FF69B4, #FFB6C1);
            border-radius: 50% 50% 50% 0;
            left: 122px;
            top: 40px;
            filter: drop-shadow(0 6px 12px rgba(255, 20, 147, 0.5));
            animation: petalSway 3s ease-in-out infinite;
        }

        .petal-middle:nth-child(9) { transform: rotate(22.5deg); animation-delay: 0.1s; }
        .petal-middle:nth-child(10) { transform: rotate(67.5deg); animation-delay: 0.3s; }
        .petal-middle:nth-child(11) { transform: rotate(112.5deg); animation-delay: 0.5s; }
        .petal-middle:nth-child(12) { transform: rotate(157.5deg); animation-delay: 0.7s; }
        .petal-middle:nth-child(13) { transform: rotate(202.5deg); animation-delay: 0.9s; }
        .petal-middle:nth-child(14) { transform: rotate(247.5deg); animation-delay: 1.1s; }
        .petal-middle:nth-child(15) { transform: rotate(292.5deg); animation-delay: 1.3s; }
        .petal-middle:nth-child(16) { transform: rotate(337.5deg); animation-delay: 1.5s; }

        /* البتلات الداخلية - البنفسجي والذهبي */
        .petal-inner {
            position: absolute;
            width: 40px;
            height: 60px;
            background: linear-gradient(135deg, #DA70D6, #FF00FF, #FFD700);
            border-radius: 50% 50% 50% 0;
            left: 130px;
            top: 70px;
            filter: drop-shadow(0 4px 8px rgba(255, 0, 255, 0.4));
            animation: petalSway 3s ease-in-out infinite;
        }

        .petal-inner:nth-child(17) { transform: rotate(11.25deg); animation-delay: 0.05s; }
        .petal-inner:nth-child(18) { transform: rotate(33.75deg); animation-delay: 0.25s; }
        .petal-inner:nth-child(19) { transform: rotate(56.25deg); animation-delay: 0.45s; }
        .petal-inner:nth-child(20) { transform: rotate(78.75deg); animation-delay: 0.65s; }
        .petal-inner:nth-child(21) { transform: rotate(101.25deg); animation-delay: 0.85s; }
        .petal-inner:nth-child(22) { transform: rotate(123.75deg); animation-delay: 1.05s; }
        .petal-inner:nth-child(23) { transform: rotate(146.25deg); animation-delay: 1.25s; }
        .petal-inner:nth-child(24) { transform: rotate(168.75deg); animation-delay: 1.45s; }
        .petal-inner:nth-child(25) { transform: rotate(191.25deg); animation-delay: 0.15s; }
        .petal-inner:nth-child(26) { transform: rotate(213.75deg); animation-delay: 0.35s; }
        .petal-inner:nth-child(27) { transform: rotate(236.25deg); animation-delay: 0.55s; }
        .petal-inner:nth-child(28) { transform: rotate(258.75deg); animation-delay: 0.75s; }
        .petal-inner:nth-child(29) { transform: rotate(281.25deg); animation-delay: 0.95s; }
        .petal-inner:nth-child(30) { transform: rotate(303.75deg); animation-delay: 1.15s; }
        .petal-inner:nth-child(31) { transform: rotate(326.25deg); animation-delay: 1.35s; }
        .petal-inner:nth-child(32) { transform: rotate(348.75deg); animation-delay: 1.55s; }

        /* مركز الوردة */
        .center {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500, #FF8C00);
            border-radius: 50%;
            left: 125px;
            top: 110px;
            z-index: 100;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8),
                        inset 0 5px 15px rgba(0, 0, 0, 0.3),
                        0 0 50px rgba(255, 0, 150, 0.6);
            animation: centerGlow 2s ease-in-out infinite;
        }

        .center::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #FFFF00, #FFD700);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
        }

        /* الساق */
        .stem {
            position: absolute;
            width: 5px;
            height: 150px;
            background: linear-gradient(90deg, #0B5F0B, #228B22, #32CD32, #00FF00);
            left: 147.5px;
            top: 160px;
            border-radius: 3px;
            filter: drop-shadow(0 3px 8px rgba(34, 139, 34, 0.6));
        }

        /* الأوراق */
        .leaf {
            position: absolute;
            width: 60px;
            height: 30px;
            background: linear-gradient(135deg, #0B5F0B, #228B22, #32CD32);
            border-radius: 0 50% 50% 50%;
            left: 80px;
            top: 220px;
            filter: drop-shadow(0 3px 8px rgba(34, 139, 34, 0.5));
            animation: leafSway 4s ease-in-out infinite;
        }

        .leaf:nth-child(33) {
            transform: rotate(-35deg);
            animation-delay: 0s;
        }

        .leaf:nth-child(34) {
            left: 160px;
            transform: rotate(35deg) scaleX(-1);
            animation-delay: 0.5s;
        }

        /* اسم Sundos */
        .name-container {
            position: absolute;
            top: 420px;
            z-index: 50;
        }

        .name {
            font-size: 60px;
            font-weight: bold;
            color: transparent;
            background: linear-gradient(135deg, #FF1493, #DA70D6, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.6);
            letter-spacing: 4px;
            animation: nameGlow 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8));
        }

        .heart {
            font-size: 40px;
            color: #FF1493;
            margin: 0 15px;
            animation: heartbeat 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.8));
        }

        /* الحروف الساقطة */
        .falling-letter {
            position: fixed;
            font-size: 50px;
            font-weight: bold;
            color: #FF1493;
            z-index: 1000;
            pointer-events: none;
            animation: fall 3s linear forwards;
            filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.8));
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        }

        /* الحركات */
        @keyframes roseFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.02); }
        }

        @keyframes petalSway {
            0%, 100% { 
                opacity: 0.9;
                filter: drop-shadow(0 8px 15px rgba(139, 0, 0, 0.6)) brightness(1);
            }
            50% { 
                opacity: 1;
                filter: drop-shadow(0 12px 25px rgba(139, 0, 0, 0.8)) brightness(1.1);
            }
        }

        @keyframes leafSway {
            0%, 100% { transform: rotate(-35deg); }
            50% { transform: rotate(-30deg); }
        }

        .leaf:nth-child(34) {
            animation: leafSway2 4s ease-in-out infinite;
        }

        @keyframes leafSway2 {
            0%, 100% { transform: rotate(35deg) scaleX(-1); }
            50% { transform: rotate(30deg) scaleX(-1); }
        }

        @keyframes centerGlow {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.8),
                            inset 0 5px 15px rgba(0, 0, 0, 0.3),
                            0 0 50px rgba(255, 0, 150, 0.6);
            }
            50% { 
                box-shadow: 0 0 50px rgba(255, 215, 0, 1),
                            inset 0 5px 15px rgba(0, 0, 0, 0.3),
                            0 0 80px rgba(255, 0, 150, 0.9);
            }
        }

        @keyframes nameGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8));
            }
            50% { 
                filter: drop-shadow(0 0 40px rgba(255, 20, 147, 1)) 
                        drop-shadow(0 0 60px rgba(218, 112, 214, 0.8));
            }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
        }

        @keyframes fall {
            0% {
                opacity: 1;
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(600px) translateX(var(--tx)) rotate(360deg);
            }
        }

        /* جزيئات براقة */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 2s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            animation: spin 2s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rose-container" id="roseContainer">
            <!-- البتلات الخارجية -->
            <div class="petal-outer"></div>
            <div class="petal-outer"></div>
            <div class="petal-outer"></div>
            <div class="petal-outer"></div>
            <div class="petal-outer"></div>
            <div class="petal-outer"></div>
            <div class="petal-outer"></div>
            <div class="petal-outer"></div>

            <!-- البتلات الوسطانية -->
            <div class="petal-middle"></div>
            <div class="petal-middle"></div>
            <div class="petal-middle"></div>
            <div class="petal-middle"></div>
            <div class="petal-middle"></div>
            <div class="petal-middle"></div>
            <div class="petal-middle"></div>
            <div class="petal-middle"></div>

            <!-- البتلات الداخلية -->
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>
            <div class="petal-inner"></div>

            <!-- المركز والساق والأوراق -->
            <div class="center"></div>
            <div class="stem"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>

            <!-- الجزيئات البراقة -->
            <div class="sparkle" style="left: 80px; top: 60px; animation-delay: 0s;"></div>
            <div class="sparkle" style="left: 220px; top: 80px; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="left: 120px; top: 150px; animation-delay: 1s;"></div>
            <div class="sparkle" style="left: 180px; top: 200px; animation-delay: 1.5s;"></div>
        </div>

        <div class="name-container">
            <div class="name">
                <span class="heart">💖</span>
                S u n d o s
                <span class="heart">💖</span>
            </div>
        </div>
    </div>

    <script>
        const letters = 'S u n d o s'.replace(/\s/g, '');
        let letterIndex = 0;

        function createFallingLetter() {
            if (letterIndex < letters.length) {
                const letter = letters[letterIndex];
                const fallingLetter = document.createElement('div');
                fallingLetter.className = 'falling-letter';
                fallingLetter.textContent = letter;
                
                // موقع عشوائي على الشاشة
                const startX = Math.random() * window.innerWidth;
                const tx = (Math.random() - 0.5) * 200;
                
                fallingLetter.style.left = startX + 'px';
                fallingLetter.style.top = '0px';
                fallingLetter.style.setProperty('--tx', tx + 'px');
                
                document.body.appendChild(fallingLetter);

                // إزالة العنصر بعد انتهاء الحركة
                setTimeout(() => {
                    fallingLetter.remove();
                }, 3000);

                letterIndex++;
                setTimeout(createFallingLetter, 400);
            }
        }

        // بدء سقوط الحروف بعد 3 ثواني من تحميل الصفحة
        setTimeout(createFallingLetter, 3000);

        // إعادة تشغيل الحركة كل 15 ثانية
        setInterval(() => {
            letterIndex = 0;
            setTimeout(createFallingLetter, 3000);
        }, 15000);
    </script>
</body>
</html>
