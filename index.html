<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sundos - The Blooming Rose</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a0b1a 0%, #0d020d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ===== الوردة ===== */
        .rose-container {
            position: relative;
            width: 350px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .rose {
            position: relative;
            width: 200px;
            height: 200px;
            transform: scale(0);
            animation: bloomRose 3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .petal {
            position: absolute;
            border-radius: 50% 50% 50% 0;
            transform-origin: bottom left;
            opacity: 0;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3), 
                        0 5px 15px rgba(255, 0, 50, 0.4);
        }

        /* طبقة خارجية - أحمر داكن */
        .p1 { width: 80px; height: 100px; background: linear-gradient(135deg, #8B0000, #DC143C); top: 20px; left: 60px; transform: rotate(0deg) scale(0); animation: petalBloom 1.5s 0.5s forwards; }
        .p2 { width: 80px; height: 100px; background: linear-gradient(135deg, #A52A2A, #FF0000); top: 20px; left: 60px; transform: rotate(45deg) scale(0); animation: petalBloom 1.5s 0.6s forwards; }
        .p3 { width: 80px; height: 100px; background: linear-gradient(135deg, #8B0000, #DC143C); top: 20px; left: 60px; transform: rotate(90deg) scale(0); animation: petalBloom 1.5s 0.7s forwards; }
        .p4 { width: 80px; height: 100px; background: linear-gradient(135deg, #A52A2A, #FF0000); top: 20px; left: 60px; transform: rotate(135deg) scale(0); animation: petalBloom 1.5s 0.8s forwards; }
        .p5 { width: 80px; height: 100px; background: linear-gradient(135deg, #8B0000, #DC143C); top: 20px; left: 60px; transform: rotate(180deg) scale(0); animation: petalBloom 1.5s 0.9s forwards; }
        .p6 { width: 80px; height: 100px; background: linear-gradient(135deg, #A52A2A, #FF0000); top: 20px; left: 60px; transform: rotate(225deg) scale(0); animation: petalBloom 1.5s 1.0s forwards; }
        .p7 { width: 80px; height: 100px; background: linear-gradient(135deg, #8B0000, #DC143C); top: 20px; left: 60px; transform: rotate(270deg) scale(0); animation: petalBloom 1.5s 1.1s forwards; }
        .p8 { width: 80px; height: 100px; background: linear-gradient(135deg, #A52A2A, #FF0000); top: 20px; left: 60px; transform: rotate(315deg) scale(0); animation: petalBloom 1.5s 1.2s forwards; }

        /* طبقة وسطى - وردي */
        .p9  { width: 60px; height: 80px; background: linear-gradient(135deg, #DC143C, #FF1493); top: 40px; left: 70px; transform: rotate(22deg) scale(0); animation: petalBloom 1.5s 1.3s forwards; }
        .p10 { width: 60px; height: 80px; background: linear-gradient(135deg, #FF0000, #FF69B4); top: 40px; left: 70px; transform: rotate(67deg) scale(0); animation: petalBloom 1.5s 1.4s forwards; }
        .p11 { width: 60px; height: 80px; background: linear-gradient(135deg, #DC143C, #FF1493); top: 40px; left: 70px; transform: rotate(112deg) scale(0); animation: petalBloom 1.5s 1.5s forwards; }
        .p12 { width: 60px; height: 80px; background: linear-gradient(135deg, #FF0000, #FF69B4); top: 40px; left: 70px; transform: rotate(157deg) scale(0); animation: petalBloom 1.5s 1.6s forwards; }
        .p13 { width: 60px; height: 80px; background: linear-gradient(135deg, #DC143C, #FF1493); top: 40px; left: 70px; transform: rotate(202deg) scale(0); animation: petalBloom 1.5s 1.7s forwards; }
        .p14 { width: 60px; height: 80px; background: linear-gradient(135deg, #FF0000, #FF69B4); top: 40px; left: 70px; transform: rotate(247deg) scale(0); animation: petalBloom 1.5s 1.8s forwards; }
        .p15 { width: 60px; height: 80px; background: linear-gradient(135deg, #DC143C, #FF1493); top: 40px; left: 70px; transform: rotate(292deg) scale(0); animation: petalBloom 1.5s 1.9s forwards; }
        .p16 { width: 60px; height: 80px; background: linear-gradient(135deg, #FF0000, #FF69B4); top: 40px; left: 70px; transform: rotate(337deg) scale(0); animation: petalBloom 1.5s 2.0s forwards; }

        /* طبقة داخلية - ذهبي وردي */
        .p17 { width: 40px; height: 60px; background: linear-gradient(135deg, #FF1493, #FFD700); top: 55px; left: 80px; transform: rotate(0deg) scale(0); animation: petalBloom 1.5s 2.1s forwards; }
        .p18 { width: 40px; height: 60px; background: linear-gradient(135deg, #FF69B4, #FFA500); top: 55px; left: 80px; transform: rotate(90deg) scale(0); animation: petalBloom 1.5s 2.2s forwards; }
        .p19 { width: 40px; height: 60px; background: linear-gradient(135deg, #FF1493, #FFD700); top: 55px; left: 80px; transform: rotate(180deg) scale(0); animation: petalBloom 1.5s 2.3s forwards; }
        .p20 { width: 40px; height: 60px; background: linear-gradient(135deg, #FF69B4, #FFA500); top: 55px; left: 80px; transform: rotate(270deg) scale(0); animation: petalBloom 1.5s 2.4s forwards; }

        /* مركز الوردة */
        .center {
            position: absolute;
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, #FFFF00, #FFD700, #FFA500);
            border-radius: 50%;
            top: 82px;
            left: 82px;
            z-index: 20;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), inset 0 3px 8px rgba(0,0,0,0.2);
            transform: scale(0);
            animation: centerBloom 1s 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* الساق */
        .stem {
            position: absolute;
            width: 5px;
            height: 120px;
            background: linear-gradient(90deg, #0B5F0B, #228B22, #32CD32);
            top: 180px;
            left: 97px;
            border-radius: 3px;
            transform-origin: top;
            transform: scaleY(0);
            animation: stemGrow 2s 0.3s ease-out forwards;
            filter: drop-shadow(0 5px 10px rgba(34, 139, 34, 0.5));
        }

        /* الأوراق */
        .leaf {
            position: absolute;
            width: 50px;
            height: 25px;
            background: linear-gradient(135deg, #0B5F0B, #228B22);
            border-radius: 0 50% 50% 50%;
            top: 240px;
            opacity: 0;
            transform: scale(0);
            animation: leafGrow 1.5s 2s ease-out forwards;
        }

        .leaf-left {
            left: 50px;
            transform: rotate(-45deg) scale(0);
        }

        .leaf-right {
            left: 100px;
            transform: rotate(45deg) scale(0);
            animation-delay: 2.3s;
        }

        /* توهج الوردة */
        .glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 20, 147, 0.2) 0%, transparent 70%);
            top: -25px;
            left: -25px;
            z-index: -1;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        /* ===== الحروف الساقطة ===== */
        .falling-letter {
            position: fixed;
            font-size: 70px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.8), 0 0 40px rgba(255, 0, 0, 0.6);
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            animation: fallDown 3s ease-in forwards;
        }

        /* ===== الحروف المرتبة ===== */
        .arranged-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .arranged-container.show {
            opacity: 1;
        }

        .arranged-letter {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FF1493, #FF0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 15px rgba(255, 20, 147, 0.6));
            transform: translateY(50px) scale(0);
            animation: arrangeIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        /* ===== الحركات ===== */
        @keyframes bloomRose {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes petalBloom {
            0% { opacity: 0; transform: rotate(var(--r, 0deg)) scale(0); }
            100% { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); }
        }

        @keyframes centerBloom {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes stemGrow {
            0% { transform: scaleY(0); opacity: 0; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        @keyframes leafGrow {
            0% { opacity: 0; transform: rotate(var(--rot, -45deg)) scale(0); }
            100% { opacity: 1; transform: rotate(var(--rot, -45deg)) scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        @keyframes fallDown {
            0% {
                opacity: 1;
                transform: translateY(-100px) rotate(0deg) scale(1);
            }
            70% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(85vh) rotate(360deg) scale(0.5);
            }
        }

        @keyframes arrangeIn {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0) rotate(-20deg);
                filter: drop-shadow(0 0 0px rgba(255, 20, 147, 0));
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
                filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8));
            }
        }

        /* ===== جزيئات براقة ===== */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #FFD700;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleAnim 2s ease-in-out infinite;
        }

        @keyframes sparkleAnim {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* ===== رسالة صغيرة ===== */
        .subtitle {
            position: fixed;
            bottom: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 3px;
            opacity: 0;
            animation: fadeIn 2s 4s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* استجابة الجوال */
        @media (max-width: 600px) {
            .rose-container { transform: scale(0.8); }
            .falling-letter { font-size: 50px; }
            .arranged-letter { font-size: 55px; }
        }
    </style>
</head>
<body>

    <!-- الوردة -->
    <div class="rose-container">
        <div class="rose">
            <div class="glow"></div>
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="petal p6"></div>
            <div class="petal p7"></div>
            <div class="petal p8"></div>
            <div class="petal p9"></div>
            <div class="petal p10"></div>
            <div class="petal p11"></div>
            <div class="petal p12"></div>
            <div class="petal p13"></div>
            <div class="petal p14"></div>
            <div class="petal p15"></div>
            <div class="petal p16"></div>
            <div class="petal p17"></div>
            <div class="petal p18"></div>
            <div class="petal p19"></div>
            <div class="petal p20"></div>
            <div class="center"></div>
            <div class="stem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
        </div>
    </div>

    <!-- حاوية الحروف المرتبة -->
    <div class="arranged-container" id="arrangedBox"></div>

    <!-- رسالة -->
    <div class="subtitle">FOR MY LOVE</div>

    <script>
        const name = "Sundos";
        const arrangedBox = document.getElementById('arrangedBox');

        // إنشاء جزيئات براقة عشوائية حول الوردة
        function createSparkles() {
            const rose = document.querySelector('.rose');
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = (Math.random() * 200) + 'px';
                sparkle.style.top = (Math.random() * 200) + 'px';
                sparkle.style.animationDelay = (Math.random() * 2) + 's';
                rose.appendChild(sparkle);
            }
        }
        createSparkles();

        // بدء سقوط الحروف بعد 3.5 ثانية (بعد اكتمال تفتح الوردة)
        setTimeout(() => {
            dropLetters();
        }, 3500);

        function dropLetters() {
            const letters = name.split('');
            
            letters.forEach((letter, index) => {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'falling-letter';
                    el.textContent = letter;
                    
                    // موقع عشوائي أفقياً
                    const randomX = Math.random() * (window.innerWidth - 100) + 50;
                    el.style.left = randomX + 'px';
                    el.style.top = '-100px';
                    
                    document.body.appendChild(el);
                    
                    // حذف الحرف بعد انتهاء السقوط
                    setTimeout(() => {
                        el.remove();
                    }, 3000);
                    
                }, index * 300); // تأخير بين كل حرف والآخر
            });

            // بعد انتهاء السقوط (بعد 3 ثواني من آخر حرف)، اعرض الحروف المرتبة
            const totalTime = (letters.length * 300) + 3000;
            setTimeout(() => {
                showArrangedLetters();
            }, totalTime);
        }

        function showArrangedLetters() {
            arrangedBox.innerHTML = '';
            const letters = name.split('');
            
            letters.forEach((letter, index) => {
                const span = document.createElement('span');
                span.className = 'arranged-letter';
                span.textContent = letter;
                span.style.animationDelay = (index * 0.15) + 's';
                arrangedBox.appendChild(span);
            });

            arrangedBox.classList.add('show');
        }

        // إعادة التشغيل كل 20 ثانية
        setInterval(() => {
            arrangedBox.classList.remove('show');
            arrangedBox.innerHTML = '';
            setTimeout(() => {
                dropLetters();
            }, 500);
        }, 20000);
    </script>
</body>
</html>
